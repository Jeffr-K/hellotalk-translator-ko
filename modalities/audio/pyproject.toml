[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hellotalk-audio-modality"
version = "0.1.0"
description = "Real-time macOS audio input PoC for HelloTalk voice rooms"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2.0,<3",
  "pydantic>=2.10,<3",
  "pywhispercpp>=1.3,<2",
  "sounddevice>=0.5,<0.6",
  "soxr>=1.0,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pyyaml>=6,<7",
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
audio-devices = "devices:main"
audio-capture = "capture:main"
live-transcribe = "live:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "api",
  "capture",
  "contracts",
  "devices",
  "frames",
  "live",
  "metrics",
  "events",
  "learning_agent",
  "realtime_service",
  "streaming_pipeline",
  "timeline",
  "transcriber",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "integration: requires macOS TTS, whisper.cpp, a local model, and Ollama",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = []
