name: test_two_speaker_interruption
description: Speaker B interrupts Speaker A and continues after Speaker A stops.
sample_rate: 16000
channels: 1
duration_ms: 6500

speakers:
  speaker-a:
    voice: Samantha
  speaker-b:
    voice: Alex

turns:
  - id: turn-a-001
    speaker_id: speaker-a
    start_ms: 0
    end_ms: 4500
    text: >-
      I think we should deploy the new version tomorrow because the current build
      still has several problems that we need to discuss before the release.

  - id: turn-b-001
    speaker_id: speaker-b
    start_ms: 3500
    end_ms: 6500
    text: >-
      No, wait. We are not ready yet and we need more time.

expected_interactions:
  - type: interruption
    actor_speaker_id: speaker-b
    target_speaker_id: speaker-a
    at_ms: 3500
    overlap_ms: 1000
